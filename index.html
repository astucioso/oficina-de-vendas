<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Estude impostos, NF-e, Shopee e o fechamento de uma pequena fábrica.">
  <title>Oficina de Vendas — Estudo da operação</title>
  <link rel="stylesheet" href="./oficina.css">
  <script defer src="./content-primeiros-impostos.js"></script>
  <script defer src="./content-primeira-venda.js"></script>
  <script defer src="./content-operacao.js"></script>
  <script defer src="./content-fiscal.js"></script>
  <script defer src="./content-gestao.js"></script>
  <script defer src="./rotina-dados.js"></script>
  <script defer src="./ferramentas.js"></script>
  <script defer src="./oficina.js"></script>
  <script defer src="./esteira.js"></script>
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <a class="brand" href="#inicio">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Oficina de Vendas</strong><small>Estudo da operação</small></span>
      </a>
      <nav aria-label="Navegação do curso">
        <a class="button" href="./financeiro/" style="display:flex;justify-content:center;margin-bottom:16px">Financeiro DURVEX</a>
        <div id="side-nav"></div>
      </nav>
      <div class="side-progress" id="side-progress"></div>
    </aside>
    <div class="work">
      <header class="topbar">
        <div class="headingcrumb">
          <button type="button" class="button subtle menu" id="menu-button" aria-controls="sidebar" aria-expanded="false"><span aria-hidden="true">☰</span> Menu</button>
          <div class="crumb" id="crumb">Início</div>
        </div>
        <button type="button" class="button" id="open-esteira" data-reader-open>Modo esteira</button>
        <button type="button" class="button search-button" id="open-search" aria-haspopup="dialog">
          <span class="icon search-icon" aria-hidden="true"></span><span>Buscar</span><kbd>Ctrl K</kbd>
        </button>
      </header>
      <main id="conteudo" tabindex="-1"></main>
      <footer class="foot"><span>Oficina de Vendas</span><span>Referências revisadas em 17 nov. 2026</span></footer>
    </div>
  </div>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="dialog-head"><h2 id="search-title">Buscar no estudo</h2><button type="button" class="button subtle" id="close-search" aria-label="Fechar busca">Fechar</button></div>
    <input id="global-query" type="search" placeholder="Ex.: DAS, repasse, cancelamento" aria-label="Termo de busca" autocomplete="off">
    <div id="global-results" class="search-results" aria-live="polite"></div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
